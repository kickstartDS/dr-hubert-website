name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r run build

      - name: Type check
        run: pnpm -r run typecheck

      - name: Run tests
        run: pnpm -r run test

      - name: Lint
        run: pnpm -r run lint

  chromatic:
    needs: build
    # Runs on pull requests as well as on pushes to main: the comparison is the
    # point on a PR, and main builds keep the baseline branch current. The
    # environment provides CHROMATIC_PROJECT_TOKEN; it has no protection rules,
    # so it is available to PR runs too (fork PRs get no secrets and skip the
    # publish step).
    environment: Production
    runs-on: ubuntu-latest
    env:
      # Job-level, so the step's own `if` can see the value. A step-level `env`
      # is not in scope for that step's condition, so the publish step would
      # otherwise run with an empty token and fail.
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Publish to Chromatic
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        run: pnpm --filter @kickstartds/design-system chromatic
